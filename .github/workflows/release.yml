# Build and publish rulegen.
#
#   push to main      → tests, then image ghcr.io/<repo>:main and a rolling
#                       pre-release named "rolling" with linux binaries
#   push tag vX.Y.Z   → tests, then image tags X.Y.Z, X.Y and latest, and a
#                       stable GitHub release with the binaries
#   pull request      → tests only
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rulegen
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  # Resolve one version string for every artifact of this run.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      stable: ${{ steps.v.outputs.stable }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

  binaries:
    needs: [test, version]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          name="rulegen_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p out/"$name"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o out/"$name"/rulegen ./cmd/rulegen
          cp README.md rulegen.yaml out/"$name"/
          tar -C out -czf out/"$name".tar.gz "$name"
          (cd out && sha256sum "$name".tar.gz > "$name".tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: rulegen-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            out/*.tar.gz
            out/*.sha256
          if-no-files-found: error

  image:
    needs: [test, version]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Rolling pre-release that always points at the latest main build.
  prerelease:
    needs: [binaries, image, version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rulegen-*
          merge-multiple: true
          path: dist
      - name: Recreate the rolling pre-release
        run: |
          gh release delete rolling --yes --cleanup-tag || true
          gh release create rolling dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly build (${{ needs.version.outputs.version }})" \
            --notes "Automatic build of \`main\` at ${GITHUB_SHA}. Image: \`${IMAGE}:main\`."

  # Stable release for tags.
  release:
    needs: [binaries, image, version]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rulegen-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Image: `${{ env.IMAGE }}:${{ needs.version.outputs.version }}` (also `latest`), linux/amd64 and linux/arm64.
