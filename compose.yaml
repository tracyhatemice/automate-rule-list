# Development environment. Nothing here touches the host Go toolchain:
# module and build caches live under ./.cache and containers run as the
# host user so every file they create is owned by you.
x-go-env: &go-env
  GOCACHE: /gocache
  GOMODCACHE: /gomod
  GOPATH: /tmp/go
  GOFLAGS: -buildvcs=false
  HOME: /tmp
  CGO_ENABLED: "0"

x-go-volumes: &go-volumes
  - .:/src
  - ./.cache/go-mod:/gomod
  - ./.cache/go-build:/gocache

services:
  dev:
    image: golang:1.27-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /src
    environment: *go-env
    volumes: *go-volumes
    profiles: ["dev"]

  # Debian-based toolchain with gcc for the race detector.
  race:
    image: golang:1.27
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /src
    environment:
      <<: *go-env
      CGO_ENABLED: "1"
    volumes: *go-volumes
    profiles: ["dev"]

  lint:
    image: golangci/golangci-lint:v2.13.2-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /src
    environment:
      <<: *go-env
      GOLANGCI_LINT_CACHE: /lintcache
    volumes:
      - .:/src
      - ./.cache/go-mod:/gomod
      - ./.cache/go-build:/gocache
      - ./.cache/golangci:/lintcache
    profiles: ["dev"]

  # S3-compatible store for integration tests.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 20
    profiles: ["s3"]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/rulegen-test"
    profiles: ["s3"]

  integration:
    image: golang:1.27-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /src
    environment:
      <<: *go-env
      RULEGEN_TEST_S3_ENDPOINT: http://minio:9000
      RULEGEN_TEST_S3_BUCKET: rulegen-test
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    volumes: *go-volumes
    depends_on:
      minio-init:
        condition: service_completed_successfully
    profiles: ["s3"]

  # The production image, wired to the shipped config.
  rulegen:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /work
    environment:
      RULEGEN_S3_BUCKET: ${RULEGEN_S3_BUCKET:-}
      RULEGEN_S3_REGION: ${RULEGEN_S3_REGION:-us-east-1}
      RULEGEN_S3_ENDPOINT: ${RULEGEN_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./rulegen.yaml:/work/rulegen.yaml:ro
      - ./locallist:/work/locallist:ro
      - ./state:/work/state
      - ./dist:/work/dist
    profiles: ["app"]
